CONFIG_FW_VERSION="1.3.0"
# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE0=y
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_GPIO=y

CONFIG_REBOOT=y

# Make sure printk is printing to the UART console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=10240

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NB-nordic123"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=16
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_PHY_UPDATE=n
# CONFIG_BT_COMPANY_ID=0x0059
#Schneider Electric
CONFIG_BT_COMPANY_ID=0x02B6	


# Enable the NUS service
CONFIG_BT_NUS=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
# Enable bonding
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

# This example requires more stack
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# mcuboot
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
# CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y
# CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
CONFIG_MCUMGR_GRP_IMG_ALLOW_ERASE_PENDING=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y


# Config logger
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Disable boot banners to avoid anything printed on the UART that does not come over NUS
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_ASSERT=y

CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=502


CONFIG_BT_NUS_AUTHEN=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_NUS_FIXED_PASSKEY=112233
CONFIG_BT_NUS_ADVERTISING_INTERVAL=500
CONFIG_BT_NUS_UART_BUFFER_SIZE=300
CONFIG_BT_CTLR_TX_PWR_PLUS_7=y
CONFIG_BT_NUS_CRLF_UART_TERMINATION=n
CONFIG_BT_CTLR_CONN_RSSI=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_TINYCRYPT_ECC=n 
CONFIG_BT_CTLR_ECDH=n
# CONFIG_BT_CTLR_ADVANCED_FEATURES=y
